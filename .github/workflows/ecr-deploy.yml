name: Build and Push to AWS ECR

on:
  push:
    branches: [ "main" ]  # 或你想要自動觸發的分支

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 819498957810.dkr.ecr.ap-northeast-1.amazonaws.com

      - name: Build Docker image
        run: docker build -t docuflow-backend:0.1 .

      - name: Tag Docker image
        run: docker tag docuflow-backend:0.1 819498957810.dkr.ecr.ap-northeast-1.amazonaws.com/nycu/docuflow:0.1

      - name: Push Docker image to Amazon ECR
        run: docker push 819498957810.dkr.ecr.ap-northeast-1.amazonaws.com/nycu/docuflow:0.1