name: CI/CD Backend (Build → Deploy → Manual Migration)

# 自動觸發：當 prod 分支有 push 時，就跑完整流程
on:
  push:
    branches: ["prod"]

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "819498957810"
  ECR_REPO: "819498957810.dkr.ecr.ap-northeast-1.amazonaws.com/nycu/docuflow"
  ECS_CLUSTER: "docuflow-ecs-cluster"
  ECS_SERVICE: "docuflow-task-service-prod"
  CONTAINER_NAME: "docuflow-api"
  TASK_DEF_FILE: ".aws/prod-task-def.json"

jobs:
  # ───────────────────────────────────────────────────────────
  # Job 1：Build & Push image to ECR
  # ───────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC
      contents: read

    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/DocuFlow-Backend-Github-Actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker image
        id: set-image-tag
        run: |
          # 1. 產生 SHORT_SHA，作為 image tag
          SHORT_SHA=$(git rev-parse --short=8 $GITHUB_SHA)

          # 2. Build image 並且加上 latest & SHA 兩個 tag
          docker build -t $ECR_REPO:$SHORT_SHA -t $ECR_REPO:latest .

          # 3. Push 這兩個 tag 到 ECR
          docker push --all-tags $ECR_REPO

          # 4. 將 SHORT_SHA 設為 job output
          echo "image_tag=$SHORT_SHA" >> $GITHUB_OUTPUT

  # ───────────────────────────────────────────────────────────
  # Job 2：Update ECS Service (使用剛剛 build 出的 image)，***不做 DB Migration***
  # ───────────────────────────────────────────────────────────
  update-service:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/DocuFlow-Backend-Github-Actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEF_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REPO }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Deploy to ECS (update service only)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
