receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  awsappsignals:
    region: ap-northeast-1
    service_name: docuflow-api
    environment: prod # prod / dev

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsappsignals]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsappsignals]
