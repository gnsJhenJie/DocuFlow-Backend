name: Python Dependency Audit (pip-audit)

on:
  push:
    branches: ['**'] 

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          else
            echo "No requirements.txt or pyproject.toml found."
          fi

      - name: Install pip-audit-extra
        run: |
          # 安裝或升級 pip-audit-extra 工具
          pip install --upgrade pip-audit-extra

      - name: Run pip-audit-extra 🚨 and generate JSON report
        run: |
          # 執行 pip-audit-extra。
          # --fail-level HIGH: 如果發現 HIGH 或 CRITICAL 級別的漏洞，則 CI 會失敗。
          # --format json: 將結果輸出為 JSON 格式。
          # > audit-report.json: 將 JSON 輸出重新導向到檔案中。
          pip-audit-extra > audit-report.json
          pip-audit-extra --fail-level HIGH 

      - name: Upload audit report
        # 即使之前的步驟失敗，也要上傳報告，以便於調試
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit-report.json
