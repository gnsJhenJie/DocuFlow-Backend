receivers:
  otlp:
    protocols:
      grpc:
      http:
exporters:
  awssignals:
    region: ap-northeast-1
    service_name: docuflow-api # 儀表板上看到的服務名稱
    environment: prod # 可用來分 production / staging
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [awssignals]
    metrics:
      receivers: [otlp]
      exporters: [awssignals]
