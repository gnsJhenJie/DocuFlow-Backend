name: Build & Push backend image

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-northeast-1
  ECR_REPO: 819498957810.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nycu/docuflow

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::819498957810:role/github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          SHORT_SHA=$(git rev-parse --short=8 $GITHUB_SHA)

          docker build -t $ECR_REPO:$SHORT_SHA -t $ECR_REPO:latest .

          docker push --all-tags $ECR_REPO

      # 觸發後續 deploy（ECR event 也能辦到；這裡用 workflow_call 比較直覺）
      - name: Trigger deploy workflow
        uses: peter-evans/workflow-dispatch@v2
        with:
          workflow: backend-deploy.yml
          ref: main
          inputs: |
            image_tag: $SHORT_SHA
